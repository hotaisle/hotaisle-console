name: maintainer approval

on:
  workflow_run:
    workflows: [ ci, review signal, required maintainer review ]
    types: [ completed ]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: maintainer-approval
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only the workflow's trusted source revision is executed. Never check out a
      # PR head, download its artifacts, install its dependencies, or use its caches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Recheck current GitHub authors and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'review signal' }}
        run: bun .github/scripts/refresh-approvals.ts
