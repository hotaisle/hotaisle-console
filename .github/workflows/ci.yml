name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: tests and pull requests can't write to the repo or publish anything.
permissions:
  contents: read

# Third-party actions are pinned to exact commits, so a moved tag can't change what runs.
jobs:
  test:
    runs-on:
      group: Shared Linux Runners
      labels: [self-hosted, Linux, X64, hotaisle-shared]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the app
        run: npm run build
      - name: Type checks (Worker and app)
        run: npm run typecheck
      - name: Worker tests (in the Workers runtime, against a stand-in Hot Aisle API)
        run: npm test
