name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tests and PRs have a read-only GitHub token and no production credentials.
# Only the main-only deploy job can use the protected production environment.
permissions:
  contents: read
  pull-requests: read

# Third-party actions are pinned to exact commits, so a moved tag can't change what runs.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Cloudflare's TypeScript config loader requires Node module hooks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint and formatting (tabs)
        run: bun run check
      - name: Build the app
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_BUILD_PR_URL: ${{ github.event.pull_request.html_url }}
        run: bun run build
      - name: Validate deployment bundle (no upload)
        run: bun run --cwd worker cf deploy --prebuilt --dry-run
      - name: Type checks (Worker and app)
        run: bun run typecheck
      - name: Component and isolated Worker tests
        run: bun run test
      - name: Save the tested production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ github.sha }}
          path: worker/.cloudflare/output/v0/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.repository == 'hotaisle/hotaisle-console' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://console.hotaisle.app
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ github.sha }}
          path: worker/.cloudflare/output/v0/
      - name: Check that this is still the latest main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/production-revision.ts
      - name: Deploy the tested bundle to Cloudflare
        if: steps.revision.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_SEND_TELEMETRY: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN in the production environment.'
            exit 1
          fi
          bun run --cwd worker cf deploy --prebuilt --tag "$GITHUB_SHA" --message "Deploy $GITHUB_SHA after main CI"
