name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: tests and pull requests can't write to the repo or publish anything.
permissions:
  contents: read

# Third-party actions are pinned to exact commits, so a moved tag can't change what runs.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build the app
        run: bun run build
      - name: Type checks (Worker and app)
        run: bun run typecheck
      - name: Worker tests (in the Workers runtime, against a stand-in Hot Aisle API)
        run: bun run test
