name: required maintainer review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  maintainer-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The organization ruleset pins this workflow to an inspected commit. Check
      # out that policy source, never the contributor's PR code or dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c7d1c57bbe449cf83254238f15b344de1c089236
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Require a maintainer author or current-commit review
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: bun .github/scripts/require-maintainer-review.ts
